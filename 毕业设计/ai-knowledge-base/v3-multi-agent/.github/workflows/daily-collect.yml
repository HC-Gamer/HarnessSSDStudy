# 每日自动采集 —— V2 的 CI 继承到 V3，入口换成 7 节点 LangGraph 工作流。
#
# 需要在仓库 Secrets 里配 DEEPSEEK_API_KEY。
# 预算通过 BUDGET_YUAN 兜底：CI 里跑飞了也烧不掉钱。
name: daily-collect-v3

on:
  schedule:
    # UTC 22:00 = 北京时间次日 06:00
    - cron: "0 22 * * *"
  workflow_dispatch:
    inputs:
      strategy:
        description: "Planner 策略档位"
        required: false
        default: "standard"
        type: choice
        options: [lite, standard, full]

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 毕业设计/ai-knowledge-base/v3-multi-agent

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: 静态完整性检查（不花 token）
        run: bash scripts/check_v3.sh
        env:
          PYTHON: python

      - name: 单元测试（跳过 LLM 用例）
        run: python -m pytest tests/

      - name: 跑一次采集工作流
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_PROVIDER: deepseek
          LLM_MODEL: deepseek-chat
          PLANNER_TARGET_COUNT: ${{ inputs.strategy || 'standard' }}
          # CI 里的硬预算上限：超了直接熔断，不会跑成天价账单
          BUDGET_YUAN: "0.5"
        run: python -m workflows.graph

      - name: 提交新增知识条目
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge/articles knowledge/pending_review
          if git diff --staged --quiet; then
            echo "本次没有新增条目，跳过提交"
          else
            git commit -m "chore(v3): daily knowledge collection $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: 上传成本报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cost-report
          path: 毕业设计/ai-knowledge-base/v3-multi-agent/knowledge/cost-report.json
          if-no-files-found: warn
